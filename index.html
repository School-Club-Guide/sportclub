<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sport Club EISJ</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1020;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            border-bottom: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            background: var(--card-bg);
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 0.5rem 1.25rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .nav-btn:hover {
            opacity: 0.9;
        }

        /* Views */
        .view {
            display: none;
            flex: 1;
            padding: 3rem 5%;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .view.active {
            display: block;
        }

        /* Student Form Section */
        .form-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 2.5rem;
            backdrop-filter: blur(12px);
            max-width: 600px;
            margin: 0 auto;
        }

        .form-container h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.8rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
        }

        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #9333ea;
        }

        .submit-btn {
            width: 100%;
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: opacity 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        /* Admin Dashboard Styles */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
        }

        .stat-card h3 {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .stat-card .number {
            font-size: 2rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid var(--card-border);
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
        }

        td {
            font-size: 0.95rem;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
        }

        .delete-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="logo">Sport Club EISJ</div>
        <button class="nav-btn" id="nav-toggle-btn" onclick="toggleView()">لوحة التحكم (الإدارة)</button>
    </nav>

    <!-- Student Registration View -->
    <div id="student-view" class="view active">
        <div class="form-container">
            <h1>التسجيل في النادي الرياضي</h1>
            <form id="registration-form">
                <div class="input-group">
                    <label for="fullName">اسم الطالب</label>
                    <input type="text" id="fullName" required placeholder="أدخل اسمك الكامل">
                </div>
                <div class="input-group">
                    <label for="grade">الصف</label>
                    <input type="text" id="grade" required placeholder="أدخل صفك الدراسي">
                </div>
                <div class="input-group">
                    <label for="number">الرقم التعريفي / الجوال</label>
                    <input type="text" id="number" required placeholder="أدخل رقمك">
                </div>
                <div class="input-group">
                    <label for="club">النشاط الرياضي المختار</label>
                    <select id="club" required>
                        <option value="" disabled selected>اختر الرياضة المفضلة</option>
                        <option value="كرة القدم">كرة القدم</option>
                        <option value="كرة السلة">كرة السلة</option>
                        <option value="السباحة">السباحة</option>
                        <option value="اللياقة البدنية">اللياقة البدنية</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn">إرسال التسجيل</button>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard View -->
    <div id="admin-view" class="view">
        <h1 style="margin-bottom: 2rem;">لوحة تحكم نادي EISJ الرياضي</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>إجمالي المسجلين</h3>
                <div class="number" id="total-registrations">0</div>
            </div>
            <div class="stat-card">
                <h3>الأنشطة المتاحة</h3>
                <div class="number">4</div>
            </div>
        </div>

        <div class="table-container">
            <h2 style="margin-bottom: 1rem;">سجلات الطلاب</h2>
            <table>
                <thead>
                    <tr>
                        <th>اسم الطالب</th>
                        <th>الصف</th>
                        <th>الرقم</th>
                        <th>النشاط المختار</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="registrations-table-body">
                    <tr>
                        <td colspan="5" style="text-align: center;">جاري التحميل...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase SDK & Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, setDoc, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // TODO: Replace with your actual Firebase config
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // View Toggling Logic with Simple Password Prompt
        window.toggleView = function() {
            const studentView = document.getElementById('student-view');
            const adminView = document.getElementById('admin-view');
            const navBtn = document.getElementById('nav-toggle-btn');

            if (studentView.classList.contains('active')) {
                const password = prompt("أدخل كلمة مرور المسؤول:");
                if (password === "admin123") { // Change "admin123" to your desired admin password
                    studentView.classList.remove('active');
                    adminView.classList.add('active');
                    navBtn.textContent = "صفحة التسجيل";
                    loadAdminData();
                } else if (password !== null) {
                    alert("كلمة المرور غير صحيحة!");
                }
            } else {
                adminView.classList.remove('active');
                studentView.classList.add('active');
                navBtn.textContent = "لوحة التحكم (الإدارة)";
            }
        }

        // Handle Student Form Submission
        document.getElementById('registration-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value;
            const grade = document.getElementById('grade').value;
            const number = document.getElementById('number').value;
            const club = document.getElementById('club').value;

            const studentKey = number.replace(/\s+/g, '_');

            try {
                await setDoc(doc(db, "registrations", studentKey), {
                    fullName,
                    grade,
                    number,
                    club,
                    timestamp: new Date()
                });
                alert("تم تسجيلك بنجاح!");
                document.getElementById('registration-form').reset();
            } catch (error) {
                console.error("Error writing document: ", error);
                alert("حدث خطأ أثناء التسجيل. حاول مرة أخرى.");
            }
        });

        // Load Data for Admin Dashboard
        async function loadAdminData() {
            const tableBody = document.getElementById('registrations-table-body');
            const totalCountEl = document.getElementById('total-registrations');
            
            try {
                const querySnapshot = await getDocs(collection(db, "registrations"));
                tableBody.innerHTML = '';
                let count = 0;

                querySnapshot.forEach((documentSnapshot) => {
                    count++;
                    const data = documentSnapshot.data();
                    const docId = documentSnapshot.id;

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${data.fullName || '-'}</td>
                        <td>${data.grade || '-'}</td>
                        <td>${data.number || '-'}</td>
                        <td>${data.club || '-'}</td>
                        <td><button class="delete-btn" onclick="deleteRecord('${docId}')">حذف</button></td>
                    `;
                    tableBody.appendChild(row);
                });

                totalCountEl.textContent = count;
                if (count === 0) {
                    tableBody.innerHTML = '<tr><td colspan="5" style="text-align: center;">لا توجد سجلات حتى الآن</td></tr>';
                }
            } catch (error) {
                console.error("Error loading data: ", error);
                tableBody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #ef4444;">فشل تحميل البيانات</td></tr>';
            }
        }

        // Global function to delete records from Admin panel
        window.deleteRecord = async function(id) {
            if (confirm("هل أنت متأكد من حذف هذا التسجيل؟")) {
                try {
                    await deleteDoc(doc(db, "registrations", id));
                    loadAdminData();
                } catch (error) {
                    console.error("Error deleting document: ", error);
                }
            }
        }
    </script>
</body>
</html>
