<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Sport Club EISJ</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1020;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 260px;
            background: var(--card-bg);
            border-left: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            padding: 2rem 1.5rem;
        }

        .sidebar h2 {
            font-size: 1.25rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
            text-align: center;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            display: block;
        }

        .nav-links a.active {
            background: var(--primary-gradient);
            color: white;
        }

        .back-link {
            margin-top: auto;
            color: var(--text-muted);
            text-decoration: none;
            text-align: center;
            padding: 0.75rem;
            border: 1px solid var(--card-border);
            border-radius: 8px;
        }

        .back-link:hover {
            color: white;
        }

        .main-content {
            flex: 1;
            padding: 2.5rem;
            overflow-y: auto;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
        }

        .stat-card h3 {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .stat-card .number {
            font-size: 2rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            overflow-x: auto;
        }

        .table-container h2 {
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid var(--card-border);
        }

        th {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; flex-direction: row; align-items: center; padding: 1rem; }
            .sidebar h2 { margin-bottom: 0; }
            .nav-links { display: none; }
            .back-link { display: none; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2>EISJ Admin</h2>
        <ul class="nav-links">
            <li><a href="#" class="active">المسجلين</a></li>
        </ul>
        <a href="index.html" class="back-link">العودة للتسجيل</a>
    </aside>

    <main class="main-content">
        <div class="header">
            <h1>لوحة تحكم نادي EISJ الرياضي</h1>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>إجمالي المسجلين</h3>
                <div class="number" id="total-registrations">0</div>
            </div>
        </div>

        <div class="table-container">
            <h2>سجلات الطلاب المسجلين</h2>
            <table>
                <thead>
                    <tr>
                        <th>اسم الطالب</th>
                        <th>الصف</th>
                        <th>الرقم</th>
                        <th>النشاط المختار</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="registrations-table-body">
                    <tr>
                        <td colspan="5" style="text-align: center;">جاري التحميل...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadRegistrations() {
            const tableBody = document.getElementById('registrations-table-body');
            const totalCountEl = document.getElementById('total-registrations');
            
            try {
                const querySnapshot = await getDocs(collection(db, "registrations"));
                tableBody.innerHTML = '';
                let count = 0;

                querySnapshot.forEach((documentSnapshot) => {
                    count++;
                    const data = documentSnapshot.data();
                    const docId = documentSnapshot.id;

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${data.fullName || '-'}</td>
                        <td>${data.grade || '-'}</td>
                        <td>${data.number || '-'}</td>
                        <td>${data.club || '-'}</td>
                        <td><button class="delete-btn" onclick="window.deleteRecord('${docId}')">حذف</button></td>
                    `;
                    tableBody.appendChild(row);
                });

                totalCountEl.textContent = count;
                if (count === 0) {
                    tableBody.innerHTML = '<tr><td colspan="5" style="text-align: center;">لا توجد سجلات حتى الآن</td></tr>';
                }
            } catch (error) {
                console.error("Error loading data: ", error);
                tableBody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #ef4444;">فشل تحميل البيانات</td></tr>';
            }
        }

        window.deleteRecord = async function(id) {
            if (confirm("هل أنت متأكد من حذف هذا التسجيل؟")) {
                try {
                    await deleteDoc(doc(db, "registrations", id));
                    loadRegistrations();
                } catch (error) {
                    console.error("Error deleting document: ", error);
                }
            }
        }

        loadRegistrations();
    </script>
</body>
</html>
